<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | JobShield AI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --void: #0b1628;
  --blue: #1a5aff;
  --cyan: #00d4ff;
  --border: rgba(0,212,255,0.12);
  --border-h: rgba(0,212,255,0.3);
  --text: #f0f8ff;
  --sub: rgba(220,240,255,0.70);
  --muted: rgba(180,215,255,0.45);
  --label: rgba(80,200,255,0.85);
  --green: #00c97e;
  --red: #f87171;
  --amber: #fbbf24;
  --card-bg: rgba(10,18,34,0.96);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--void);
  color: var(--text);
  min-height: 100vh;
  display: flex; flex-direction: column;
  overflow-x: hidden;
}

/* BG */
.bg-layer {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 55% 50% at 92% 8%,  rgba(0,212,255,0.28) 0%, transparent 55%),
    radial-gradient(ellipse 60% 55% at 5%  90%,  rgba(26,90,255,0.38) 0%, transparent 60%),
    radial-gradient(ellipse 50% 45% at 50% 50%,  rgba(14,40,90,0.5)  0%, transparent 70%),
    var(--void);
}
.bg-grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(0,212,255,0.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.055) 1px, transparent 1px);
  background-size: 58px 58px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 100%);
}
canvas#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* NAVBAR */
.navbar {
  position: fixed; top: 0; width: 100%; z-index: 200;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 52px; height: 64px;
  background: rgba(4,9,15,0.75); backdrop-filter: blur(32px);
  border-bottom: 1px solid var(--border);
}
.logo {
  font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 900;
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: white;
}
.logo-icon {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, var(--blue), var(--cyan));
  display: flex; align-items: center; justify-content: center; font-size: 16px;
  box-shadow: 0 0 18px rgba(0,212,255,0.32);
}
.logo em { font-style:normal; background:linear-gradient(90deg,#fff,var(--cyan)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

.nav-back {
  color: var(--sub); text-decoration: none; font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 7px; padding: 8px 18px;
  border-radius: 100px; border: 1px solid var(--border); transition: all .25s;
}
.nav-back:hover { color: #fff; border-color: var(--border-h); background: rgba(0,212,255,0.06); }

/* MAIN LAYOUT */
.main {
  position: relative; z-index: 1; flex: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 80px 40px 48px; gap: 56px;
}

/* ── LEFT PANEL ── */
.left-panel {
  flex-shrink: 0; width: 320px;
  display: flex; flex-direction: column; align-items: center; gap: 22px;
  animation: riseUp .8s .1s cubic-bezier(.22,1,.36,1) both;
}
@keyframes riseUp { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:none} }

/* SVG ILLUSTRATION BOX */
.illus-box {
  width: 280px; height: 260px; border-radius: 26px; overflow: hidden;
  background: rgba(8,16,34,0.85); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 50px rgba(0,212,255,0.1), inset 0 0 40px rgba(0,212,255,0.03);
  position: relative;
}
.illus-box::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(0,212,255,0.08), transparent 60%);
}
.illus-box::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle, rgba(0,212,255,0.12) 1px, transparent 1px);
  background-size: 20px 20px; opacity: .4;
  mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black, transparent);
}

/* panel text */
.panel-text { text-align: center; }
.panel-text h3 {
  font-family: 'Syne', sans-serif; font-size: 21px; font-weight: 900;
  color: #ffffff; letter-spacing: -.4px;
}
.panel-text h3 em {
  font-style: normal;
  background: linear-gradient(90deg, var(--blue), var(--cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.panel-text p { font-size: 13px; color: var(--sub); margin-top: 5px; line-height: 1.6; }



/* ── REGISTER CARD ── */
.reg-card {
  width: 440px; flex-shrink: 0;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 26px; padding: 38px 38px 36px;
  box-shadow: 0 0 0 1px rgba(0,212,255,0.03), 0 28px 80px rgba(0,0,0,0.62);
  animation: riseUp .8s .2s cubic-bezier(.22,1,.36,1) both;
  position: relative; overflow: hidden;
}
/* top gradient line */
.reg-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), var(--blue), var(--cyan), transparent);
}

.card-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--cyan);
  background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.18);
  padding: 4px 11px; border-radius: 100px; margin-bottom: 12px;
}
.card-tag::before { content:''; width:5px; height:5px; border-radius:50%; background:var(--cyan); flex-shrink:0; }

.card-title {
  font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 900;
  letter-spacing: -.5px; color: #ffffff; margin-bottom: 5px;
}
.card-title em {
  font-style: normal;
  background: linear-gradient(90deg, #7eb8ff, var(--cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.card-sub { font-size: 13.5px; color: var(--sub); margin-bottom: 22px; line-height: 1.6; }

/* FIELDS GRID */
.fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin-bottom: 4px; }
.field-full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 6px; }

.field label {
  font-size: 11px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--label);
}
.field input, .field select {
  background: rgba(4,9,15,0.85);
  border: 1px solid var(--border); border-radius: 12px;
  padding: 11px 14px; color: #f0f8ff;
  font-family: 'DM Sans'; font-size: 13.5px; font-weight: 400;
  outline: none; transition: all .25s;
}
.field input::placeholder { color: rgba(255,255,255,0.17); }
.field select { cursor: pointer; appearance: none; }
.field select option { background: #0a1628; color: #f0f8ff; }
.field input:focus, .field select:focus {
  border-color: rgba(0,212,255,0.45);
  background: rgba(0,212,255,0.025);
  box-shadow: 0 0 0 3px rgba(0,212,255,0.07);
}

/* password */
.pwd-wrap { position: relative; }
.pwd-wrap input { padding-right: 44px; }
.eye-btn {
  position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: rgba(255,255,255,0.22);
  cursor: pointer; transition: color .2s; padding: 3px; line-height: 1;
}
.eye-btn:hover { color: var(--cyan); }

/* strength bars */
.strength-row { display: flex; gap: 4px; margin-top: 6px; }
.s-bar {
  flex: 1; height: 3px; border-radius: 3px;
  background: rgba(255,255,255,0.08); transition: background .4s;
}
.s-bar.weak { background: var(--red); }
.s-bar.med  { background: var(--amber); }
.s-bar.str  { background: var(--green); }
.strength-label { font-size: 11.5px; margin-top: 5px; font-weight: 600; }

/* TOAST */
.toast {
  border-radius: 12px; padding: 11px 14px; font-size: 13.5px;
  margin-bottom: 16px; display: none; align-items: center; gap: 9px;
  font-weight: 500; line-height: 1.4;
}
.toast.show { display: flex; }
.toast.ok  { background: rgba(0,201,126,0.1);  border: 1px solid rgba(0,201,126,0.25);  color: #7ee8c2; }
.toast.err { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.25); color: #fca5a5; }

/* SUBMIT */
.submit-btn {
  width: 100%; padding: 13.5px; border-radius: 13px; border: none;
  background: linear-gradient(135deg, var(--blue), #0e9be6, var(--cyan));
  background-size: 200% 200%; background-position: 0% 50%;
  color: white; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 15px;
  cursor: pointer;
  box-shadow: 0 4px 24px rgba(0,212,255,0.22), inset 0 1px 0 rgba(255,255,255,0.1);
  transition: all .3s cubic-bezier(.22,1,.36,1);
  position: relative; overflow: hidden; margin: 18px 0 20px;
}
.submit-btn:hover {
  transform: translateY(-2px); background-position: 100% 50%;
  box-shadow: 0 8px 36px rgba(0,212,255,0.42);
}
.submit-btn:active { transform: none; }
.submit-btn .btn-txt { position: relative; z-index: 1; }
.submit-btn .spinner {
  display: none; width: 17px; height: 17px;
  border: 2.5px solid rgba(255,255,255,0.3); border-top-color: white;
  border-radius: 50%; animation: spin .7s linear infinite;
  margin: 0 auto; position: relative; z-index: 1;
}
@keyframes spin { to { transform: rotate(360deg); } }
.submit-btn.loading .btn-txt { display: none; }
.submit-btn.loading .spinner { display: block; }

.card-links { text-align: center; font-size: 13.5px; color: var(--sub); }
.card-links a { color: var(--cyan); font-weight: 700; text-decoration: none; }
.card-links a:hover { opacity: .75; }

/* FOOTER */
footer {
  position: relative; z-index: 1;
  border-top: 1px solid var(--border);
  padding: 18px 52px;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
}
.footer-logo {
  font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 800;
  display: flex; align-items: center; gap: 8px; text-decoration: none; color: white;
}
.fi { width:24px; height:24px; border-radius:7px; background:linear-gradient(135deg,var(--blue),var(--cyan)); display:flex;align-items:center;justify-content:center;font-size:11px; }
.footer-logo em { font-style:normal; background:linear-gradient(90deg,#fff,var(--cyan)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.footer-copy { font-size: 11.5px; color: rgba(255,255,255,0.14); }

@media(max-width:900px){ .left-panel{display:none} .reg-card{width:100%;max-width:440px} }

/* ── SVG SCENE ANIMATIONS ── */
.scene-svg { position: relative; z-index: 1; }

/* main shield bob */
.shield-group { animation: shieldBob 3.5s ease-in-out infinite; transform-origin: 50% 50%; }
@keyframes shieldBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }

/* orbit ring */
.orbit-ring { animation: orbitSpin 10s linear infinite; transform-origin: 110px 110px; }
@keyframes orbitSpin { to { transform: rotate(360deg); } }

/* radar pulse rings */
.radar1 { animation: radarPulse 2.8s ease-out infinite; transform-origin: 110px 125px; }
.radar2 { animation: radarPulse 2.8s ease-out infinite .9s; transform-origin: 110px 125px; }
.radar3 { animation: radarPulse 2.8s ease-out infinite 1.8s; transform-origin: 110px 125px; }
@keyframes radarPulse {
  0%   { opacity:.7; transform:scale(.3); }
  100% { opacity:0;  transform:scale(1.6); }
}

/* checkmarks pop in */
.check1 { animation: checkPop 3s ease-in-out infinite; }
.check2 { animation: checkPop 3s ease-in-out infinite .6s; }
.check3 { animation: checkPop 3s ease-in-out infinite 1.2s; }
@keyframes checkPop {
  0%,60%,100% { opacity: .25; transform: scale(.9); }
  30%         { opacity: 1;   transform: scale(1.05); }
}

/* scan line sweep */
.scan-line { animation: scanMove 3s ease-in-out infinite; }
@keyframes scanMove {
  0%,100% { transform: translateY(-22px); opacity: 0; }
  20%     { opacity: .8; }
  80%     { opacity: .8; }
  100%    { transform: translateY(22px); opacity: 0; }
}

/* floating particles */
.fp { animation: floatP 4s ease-in-out infinite; }
.fp:nth-child(1) { animation-delay: 0s; }
.fp:nth-child(2) { animation-delay: 1.3s; }
.fp:nth-child(3) { animation-delay: 2.6s; }
@keyframes floatP {
  0%,100% { opacity:0; transform:translateY(0) scale(.5); }
  40%     { opacity:.9; }
  100%    { opacity:0; transform:translateY(-28px) scale(1.2); }
}

/* keyhole glow */
.kh-pulse { animation: khPulse 2.2s ease-in-out infinite; }
@keyframes khPulse { 0%,100%{opacity:.5} 50%{opacity:1; filter:drop-shadow(0 0 5px #00d4ff)} }
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="bg-grid"></div>
<canvas id="stars"></canvas>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="index.html" class="logo">
    <div class="logo-icon">🛡</div>
    Job<em>Shield</em>
  </a>
  <a href="index.html" class="nav-back">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
      <path d="M8.5 2L3.5 6.5L8.5 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Back to Home
  </a>
</nav>

<div class="main">

  <!-- LEFT PANEL -->
  <div class="left-panel">

    <!-- SVG ILLUSTRATION — job shield scanner -->
    <div class="illus-box">
      <svg class="scene-svg" width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- radar pulse rings -->
        <ellipse class="radar1" cx="110" cy="125" rx="54" ry="16" stroke="rgba(0,212,255,0.35)" stroke-width="1.2" fill="none"/>
        <ellipse class="radar2" cx="110" cy="125" rx="54" ry="16" stroke="rgba(0,212,255,0.25)" stroke-width="1" fill="none"/>
        <ellipse class="radar3" cx="110" cy="125" rx="54" ry="16" stroke="rgba(26,90,255,0.2)" stroke-width="1" fill="none"/>

        <!-- orbit ring with dots -->
        <g class="orbit-ring">
          <circle cx="110" cy="110" r="78" stroke="rgba(0,212,255,0.1)" stroke-width="1" stroke-dasharray="5 6" fill="none"/>
          <circle cx="110" cy="32"  r="4" fill="#00d4ff" opacity=".7"/>
          <circle cx="182" cy="140" r="3" fill="#1a5aff" opacity=".6"/>
          <circle cx="38"  cy="140" r="3" fill="#00d4ff" opacity=".5"/>
        </g>

        <!-- main shield group -->
        <g class="shield-group">
          <!-- shield body -->
          <path d="M110 34L72 50V90C72 116 90 138 110 148C130 138 148 116 148 90V50L110 34Z"
            fill="url(#shieldBg)" stroke="url(#shieldStroke)" stroke-width="1.8"/>
          <!-- shield inner shine -->
          <path d="M110 34L72 50V65C72 65 88 62 110 63C132 62 148 65 148 65V50L110 34Z"
            fill="rgba(255,255,255,0.055)"/>

          <!-- scan line inside shield -->
          <clipPath id="shieldClip">
            <path d="M110 34L72 50V90C72 116 90 138 110 148C130 138 148 116 148 90V50L110 34Z"/>
          </clipPath>
          <g clip-path="url(#shieldClip)">
            <rect class="scan-line" x="72" y="80" width="76" height="2" rx="1" fill="url(#scanGrad)" opacity=".9"/>
          </g>

          <!-- lock icon -->
          <rect class="kh-pulse" x="99" y="96" width="22" height="18" rx="5" fill="url(#lockBody)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
          <path d="M103.5 96V91.5C103.5 88.5 106 86 110 86C114 86 116.5 88.5 116.5 91.5V96"
            stroke="url(#lockArc)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
          <circle cx="110" cy="105" r="2.8" fill="rgba(255,255,255,0.75)"/>
          <rect x="108.7" y="107" width="2.6" height="4" rx="1.3" fill="rgba(255,255,255,0.5)"/>
        </g>

        <!-- floating dots -->
        <circle class="fp" cx="60"  cy="95"  r="3" fill="#00d4ff" opacity="0"/>
        <circle class="fp" cx="158" cy="88"  r="2.5" fill="#1a5aff" opacity="0"/>
        <circle class="fp" cx="80"  cy="148" r="2" fill="#00d4ff" opacity="0"/>

        <!-- check rows — scanned items -->
        <g class="check1" transform="translate(46, 158)">
          <rect width="50" height="14" rx="7" fill="rgba(0,201,126,0.1)" stroke="rgba(0,201,126,0.25)" stroke-width="1"/>
          <path d="M10 7l2.5 2.5 5-5" stroke="#00c97e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="22" y="5" width="20" height="4" rx="2" fill="rgba(0,212,255,0.25)"/>
        </g>
        <g class="check2" transform="translate(46, 176)">
          <rect width="50" height="14" rx="7" fill="rgba(0,201,126,0.08)" stroke="rgba(0,201,126,0.2)" stroke-width="1"/>
          <path d="M10 7l2.5 2.5 5-5" stroke="#00c97e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="22" y="5" width="14" height="4" rx="2" fill="rgba(0,212,255,0.2)"/>
        </g>
        <g class="check3" transform="translate(46, 194)">
          <rect width="50" height="14" rx="7" fill="rgba(0,201,126,0.06)" stroke="rgba(0,201,126,0.15)" stroke-width="1"/>
          <path d="M10 7l2.5 2.5 5-5" stroke="#00c97e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="22" y="5" width="18" height="4" rx="2" fill="rgba(0,212,255,0.15)"/>
        </g>

        <!-- corner accents -->
        <circle cx="32"  cy="38"  r="2" fill="rgba(0,212,255,0.45)"/>
        <circle cx="188" cy="42"  r="2" fill="rgba(26,90,255,0.55)"/>
        <circle cx="26"  cy="170" r="1.5" fill="rgba(0,212,255,0.3)"/>
        <circle cx="194" cy="168" r="1.5" fill="rgba(26,90,255,0.3)"/>

        <defs>
          <linearGradient id="shieldBg" x1="72" y1="34" x2="148" y2="148" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0d2050"/>
            <stop offset="100%" stop-color="#060e24"/>
          </linearGradient>
          <linearGradient id="shieldStroke" x1="72" y1="34" x2="148" y2="148" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="rgba(0,212,255,0.7)"/>
            <stop offset="100%" stop-color="rgba(26,90,255,0.35)"/>
          </linearGradient>
          <linearGradient id="lockBody" x1="99" y1="96" x2="121" y2="114" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="rgba(0,212,255,0.2)"/>
            <stop offset="100%" stop-color="rgba(26,90,255,0.15)"/>
          </linearGradient>
          <linearGradient id="lockArc" x1="103.5" y1="86" x2="116.5" y2="96" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00d4ff"/>
            <stop offset="100%" stop-color="#1a5aff"/>
          </linearGradient>
          <linearGradient id="scanGrad" x1="72" y1="0" x2="148" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="rgba(0,212,255,0)"/>
            <stop offset="50%"  stop-color="rgba(0,212,255,0.9)"/>
            <stop offset="100%" stop-color="rgba(0,212,255,0)"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <div class="panel-text">
      <h3>Join <em>JobShield AI</em></h3>
      <p>Free forever. No hidden charges.<br>Stay safe from fake jobs.</p>
    </div>


  </div>

  <!-- REGISTER CARD -->
  <div class="reg-card">
    <span class="card-tag">New Account</span>
    <div class="card-title">Create <em>Account</em></div>
    <p class="card-sub">Takes 30 seconds. Saves you from scams forever.</p>

    <div class="toast" id="toast"><span id="ti"></span><span id="tm"></span></div>

    <div class="fields-grid">

      <div class="field field-full">
        <label>Username *</label>
        <input type="text" id="username" placeholder="Choose a username" autocomplete="off">
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="Optional">
      </div>

      <div class="field">
        <label>Mobile</label>
        <input type="text" id="mobile" placeholder="Optional">
      </div>

      <div class="field field-full">
        <label>Security Question *</label>
        <select id="security_question">
          <option value="">— Select a question —</option>
          <option value="A book or movie that influenced you early on?">A book or movie that influenced you?</option>
          <option value="A place that left a lasting impression on you?">A place that left an impression?</option>
          <option value="A skill or hobby you enjoyed learning as a child?">A skill you learned as a child?</option>
          <option value="Someone who inspired you growing up?">Someone who inspired you?</option>
        </select>
      </div>

      <div class="field field-full">
        <label>Security Answer *</label>
        <input type="text" id="security_answer" placeholder="Your answer (remember this)">
      </div>

      <div class="field field-full">
        <label>Password *</label>
        <div class="pwd-wrap">
          <input type="password" id="password" placeholder="Create a strong password" onkeyup="checkStrength()">
          <button class="eye-btn" onclick="togglePwd()" id="eyeBtn">
            <svg id="eyeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="strength-row">
          <div class="s-bar" id="b1"></div>
          <div class="s-bar" id="b2"></div>
          <div class="s-bar" id="b3"></div>
          <div class="s-bar" id="b4"></div>
        </div>
        <div class="strength-label" id="sLabel"></div>
      </div>

    </div>

    <button class="submit-btn" id="regBtn" onclick="registerUser()">
      <span class="btn-txt">Create Account →</span>
      <div class="spinner"></div>
    </button>

    <div class="card-links">Already have an account? <a href="login.html">Login here</a></div>
  </div>

</div>

<footer>
  <a href="index.html" class="footer-logo">
    <div class="fi">🛡</div>Job<em>Shield</em>
  </a>
  <div class="footer-copy">© 2026 JobShield AI — Stay Smart, Stay Safe</div>
</footer>

<script>
/* STARS */
const cv=document.getElementById("stars"),cx=cv.getContext("2d");let st=[],fs=[];
function rsz(){cv.width=innerWidth;cv.height=innerHeight;st=[];const n=Math.floor(innerWidth*innerHeight/6000);for(let i=0;i<n;i++){const r=Math.random();st.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.3+.1,a:Math.random(),d:(Math.random()*.004+.002)*(Math.random()<.5?1:-1),c:r<.18?"#00d4ff":r<.35?"#1a5aff":"#ffffff"});}}
rsz();addEventListener("resize",rsz);
function spawnFalling(){fs.push({x:Math.random()*cv.width,y:-10,len:Math.random()*65+35,speed:Math.random()*3+2,a:1,ang:Math.PI/5});}
setInterval(spawnFalling,1900);spawnFalling();spawnFalling();
(function draw(){cx.clearRect(0,0,cv.width,cv.height);for(const s of st){s.a=Math.max(.03,Math.min(1,s.a+s.d));if(s.a<=.03||s.a>=1)s.d*=-1;cx.save();cx.globalAlpha=s.a;if(s.r>1){cx.shadowBlur=s.r*4;cx.shadowColor=s.c;}cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);cx.fillStyle=s.c;cx.fill();cx.restore();}
fs=fs.filter(f=>f.a>.02);for(const f of fs){f.x+=Math.cos(f.ang)*f.speed;f.y+=Math.sin(f.ang)*f.speed;f.a-=.013;const tx=f.x-Math.cos(f.ang)*f.len,ty=f.y-Math.sin(f.ang)*f.len;const g=cx.createLinearGradient(tx,ty,f.x,f.y);g.addColorStop(0,"rgba(255,255,255,0)");g.addColorStop(1,`rgba(0,212,255,${f.a})`);cx.save();cx.globalAlpha=f.a;cx.shadowBlur=5;cx.shadowColor="#00d4ff";cx.beginPath();cx.moveTo(tx,ty);cx.lineTo(f.x,f.y);cx.strokeStyle=g;cx.lineWidth=1.5;cx.stroke();cx.beginPath();cx.arc(f.x,f.y,1.5,0,Math.PI*2);cx.fillStyle="#fff";cx.fill();cx.restore();}
requestAnimationFrame(draw);})();

/* EYE TOGGLE */
let pwdVisible=false;
function togglePwd(){const p=document.getElementById("password");pwdVisible=!pwdVisible;p.type=pwdVisible?"text":"password";document.getElementById("eyeIcon").innerHTML=pwdVisible?`<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>` :`<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;}

/* STRENGTH */
function checkStrength(){
  const v=document.getElementById("password").value;
  const bars=[document.getElementById("b1"),document.getElementById("b2"),document.getElementById("b3"),document.getElementById("b4")];
  const lbl=document.getElementById("sLabel");
  let s=0;
  if(v.length>=8)s++;if(/[A-Z]/.test(v))s++;if(/[0-9]/.test(v))s++;if(/[\W]/.test(v))s++;
  bars.forEach((b,i)=>{b.className="s-bar";
    if(v.length>0){if(s<=1){if(i<1)b.classList.add("weak");}else if(s<=2){if(i<2)b.classList.add("med");}else if(s<=3){if(i<3)b.classList.add("med");}else{b.classList.add("str");}}
  });
  if(!v){lbl.textContent="";lbl.style.color="";}
  else if(s<=1){lbl.textContent="Weak password";lbl.style.color="var(--red)";}
  else if(s<=3){lbl.textContent="Medium — add symbols";lbl.style.color="var(--amber)";}
  else{lbl.textContent="Strong password ✓";lbl.style.color="var(--green)";}
}

/* TOAST */
function toast(msg,type){
  const t=document.getElementById("toast");
  document.getElementById("ti").textContent=type==="ok"?"✅":"❌";
  document.getElementById("tm").textContent=msg;
  t.className="toast show "+(type==="ok"?"ok":"err");
}

/* ENTER */
document.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();registerUser();}});

/* REGISTER */
function registerUser(){
  const btn=document.getElementById("regBtn");
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value.trim();
  const question=document.getElementById("security_question").value;
  const answer=document.getElementById("security_answer").value.trim();
  if(!username||!password||!question||!answer){toast("Please fill all required fields.","err");return;}
  btn.classList.add("loading");
  fetch("http://127.0.0.1:5000/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password,security_question:question,security_answer:answer})})
  .then(r=>r.json()).then(data=>{
    btn.classList.remove("loading");
    if(data.status==="success"){toast("Account created!","ok");setTimeout(()=>window.location.href="login.html",1400);}
    else if(data.status==="exists"){toast("Username already taken — try another.","err");}
    else{toast("Something went wrong. Try again.","err");}
  }).catch(()=>{btn.classList.remove("loading");toast("Server not reachable — check backend.","err");});
}
</script>
</body>
</html>
