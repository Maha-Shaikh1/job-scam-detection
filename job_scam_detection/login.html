<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | JobShield AI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --void:#060d1a;
  --blue:#1a5aff;
  --cyan:#00d4ff;
  --sky:#38bdf8;
  --border:rgba(0,212,255,0.13);
  --text:#e8f4ff;
  --muted:rgba(210,235,255,0.6);
  --green:#00c97e;
  --red:#f87171;
}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--void);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

/* BG */
#mesh{position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse 60% 55% at 10% 20%,rgba(26,90,255,0.32) 0%,transparent 60%),
  radial-gradient(ellipse 50% 45% at 90% 80%,rgba(0,212,255,0.18) 0%,transparent 55%),
  radial-gradient(ellipse 40% 40% at 50% 50%,rgba(26,90,255,0.1) 0%,transparent 70%),
  var(--void);
  animation:hueS 18s ease-in-out infinite alternate}
@keyframes hueS{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(14deg)}}
#grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.015;
  background-image:linear-gradient(rgba(0,212,255,1) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,1) 1px,transparent 1px);
  background-size:64px 64px}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none}

/* NAVBAR */
.navbar{position:fixed;top:0;width:100%;z-index:200;display:flex;justify-content:space-between;align-items:center;padding:0 60px;height:68px;background:rgba(6,13,26,0.78);backdrop-filter:blur(28px);border-bottom:1px solid var(--border)}
.logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:900;display:flex;align-items:center;gap:9px;text-decoration:none;color:white}
.logo-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 0 20px rgba(0,212,255,.38)}
.logo span{background:linear-gradient(90deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-back{color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:9px;border:1px solid var(--border);transition:.25s}
.nav-back:hover{color:white;border-color:rgba(0,212,255,.3);background:rgba(0,212,255,.06)}

/* MAIN */
.main{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;padding:90px 40px 40px;gap:80px}

/* ── CSS ROBOT ── */
.robot-wrap{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:24px;animation:riseUp .9s .1s ease both}
@keyframes riseUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}

.robot{
  width:180px;
  animation:float 3.5s ease-in-out infinite;
  filter:drop-shadow(0 0 40px rgba(0,212,255,.45));
  position:relative;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

/* head */
.r-head{
  width:90px;height:74px;background:linear-gradient(160deg,#0d2460,#0a1a40);
  border-radius:18px;margin:0 auto;position:relative;
  border:2px solid rgba(0,212,255,.35);
  box-shadow:0 0 24px rgba(0,212,255,.2),inset 0 0 14px rgba(0,212,255,.07);
}
/* antenna */
.r-head::before{content:"";position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:3px;height:14px;background:rgba(0,212,255,.6);border-radius:2px}
.r-head::after{content:"";position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan),0 0 24px var(--cyan);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1;transform:translateX(-50%) scale(1)}50%{opacity:.25;transform:translateX(-50%) scale(.6)}}
/* eyes */
.r-eyes{display:flex;justify-content:center;gap:18px;padding-top:20px}
.r-eye{width:16px;height:16px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan),0 0 20px rgba(0,212,255,.7);animation:eyeBlink 3.2s ease-in-out infinite}
@keyframes eyeBlink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
/* mouth */
.r-mouth{width:36px;height:5px;background:linear-gradient(90deg,transparent,rgba(0,212,255,.5),transparent);border-radius:3px;margin:10px auto 0;position:relative;overflow:hidden}
.r-mouth::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(0,212,255,.9),transparent);animation:scan 1.8s linear infinite;transform:translateX(-100%)}
@keyframes scan{to{transform:translateX(100%)}}

/* neck */
.r-neck{width:20px;height:10px;background:linear-gradient(180deg,#0a1a40,#071530);margin:0 auto;border-left:1px solid rgba(0,212,255,.2);border-right:1px solid rgba(0,212,255,.2)}

/* body */
.r-body{
  width:110px;height:90px;background:linear-gradient(160deg,#0d2460,#071530);
  border-radius:16px;margin:0 auto;position:relative;
  border:2px solid rgba(0,212,255,.3);
  box-shadow:0 0 30px rgba(0,212,255,.15),inset 0 0 20px rgba(0,212,255,.05);
}
.r-core{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,.9),rgba(26,90,255,.7));margin:16px auto 0;box-shadow:0 0 20px rgba(0,212,255,.8),0 0 40px rgba(0,212,255,.4);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 20px rgba(0,212,255,.8),0 0 40px rgba(0,212,255,.4)}50%{transform:scale(1.18);box-shadow:0 0 30px rgba(0,212,255,1),0 0 60px rgba(0,212,255,.6)}}
.r-vents{display:flex;justify-content:center;gap:5px;margin-top:10px}
.r-vent{width:22px;height:4px;border-radius:3px;background:rgba(0,212,255,.18);border:1px solid rgba(0,212,255,.15)}

/* arms */
.r-arms{display:flex;justify-content:space-between;width:150px;margin:-70px auto 0;position:relative;z-index:-1}
.r-arm{width:18px;height:62px;background:linear-gradient(180deg,#0d2460,#071530);border-radius:9px;border:1.5px solid rgba(0,212,255,.25)}
.r-arm.left{transform-origin:top center;animation:swingL 2.4s ease-in-out infinite}
.r-arm.right{transform-origin:top center;animation:swingR 2.4s ease-in-out infinite}
@keyframes swingL{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes swingR{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-8deg)}}

/* legs */
.r-legs{display:flex;justify-content:center;gap:14px;margin-top:4px}
.r-leg{width:22px;height:36px;background:linear-gradient(180deg,#0d2460,#071530);border-radius:8px;border:1.5px solid rgba(0,212,255,.22)}
.r-leg.left{animation:legL 1.2s ease-in-out infinite}
.r-leg.right{animation:legR 1.2s ease-in-out infinite}
@keyframes legL{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes legR{0%,100%{transform:translateY(-5px)}50%{transform:translateY(0)}}

/* orbit rings */
.r-orbit-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;width:260px;height:260px}
.r-ring{position:absolute;border-radius:50%;border:1.5px dashed}
.r-ring-1{inset:0;border-color:rgba(0,212,255,.22);animation:spinCW 8s linear infinite}
.r-ring-2{inset:22px;border-color:rgba(26,90,255,.2);animation:spinCCW 11s linear infinite}
@keyframes spinCW{to{transform:rotate(360deg)}}
@keyframes spinCCW{to{transform:rotate(-360deg)}}
.r-dot{position:absolute;width:8px;height:8px;border-radius:50%;top:-4px;left:50%;transform:translateX(-50%)}
.r-dot-c{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.r-dot-b{background:var(--blue);box-shadow:0 0 8px var(--blue)}

/* robot label */
.robot-label{text-align:center}
.robot-label h3{font-family:'Syne',sans-serif;font-size:20px;font-weight:900;background:linear-gradient(90deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.robot-label p{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.5px}

/* ── LOGIN CARD ── */
.login-card{
  width:420px;flex-shrink:0;
  background:rgba(8,18,38,0.92);border:1px solid var(--border);
  border-radius:24px;padding:44px 40px;backdrop-filter:blur(24px);
  box-shadow:0 32px 80px rgba(0,0,0,.5),0 0 0 1px rgba(0,212,255,.05);
  animation:riseUp .9s .25s ease both;position:relative;overflow:hidden;
}
.login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--blue),var(--cyan),var(--blue),transparent)}

.card-tag{font-size:10px;font-weight:700;letter-spacing:3.5px;text-transform:uppercase;color:var(--cyan);margin-bottom:12px;display:block}
.card-title{font-family:'Syne',sans-serif;font-size:30px;font-weight:900;letter-spacing:-1.2px;margin-bottom:6px}
.card-title span{background:linear-gradient(90deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card-sub{font-size:13.5px;color:var(--muted);margin-bottom:32px;line-height:1.6}

/* fields */
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(0,212,255,.7);margin-bottom:7px}
.field-wrap{position:relative}
.field-wrap input{
  width:100%;padding:13px 46px 13px 16px;
  background:rgba(6,13,26,.85);border:1px solid var(--border);
  border-radius:12px;color:var(--text);font-family:'DM Sans';font-size:14px;
  outline:none;transition:.3s;
}
.field-wrap input::placeholder{color:rgba(255,255,255,.2)}
.field-wrap input:focus{border-color:rgba(0,212,255,.5);box-shadow:0 0 0 3px rgba(0,212,255,.08);background:rgba(6,13,26,1)}
.eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:rgba(255,255,255,.25);font-size:16px;transition:.2s;background:none;border:none;padding:0;line-height:1}
.eye-btn:hover{color:var(--cyan)}

/* toast */
.toast{
  border-radius:10px;padding:11px 14px;font-size:13px;
  margin-bottom:18px;display:none;align-items:center;gap:10px;
  font-weight:500;
}
.toast.show{display:flex}
.toast.ok{background:rgba(0,201,126,.1);border:1px solid rgba(0,201,126,.25);color:#6ee7b7}
.toast.err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);color:#fca5a5}

/* login btn */
.login-btn{
  width:100%;padding:14px;border-radius:13px;border:none;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  color:white;font-family:'Syne',sans-serif;font-weight:800;font-size:15px;
  cursor:pointer;box-shadow:0 0 30px rgba(0,212,255,.35);
  transition:.35s;position:relative;overflow:hidden;letter-spacing:.3px;
  margin-bottom:24px;
}
.login-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--cyan),var(--blue));opacity:0;transition:.35s}
.login-btn:hover::before{opacity:1}
.login-btn:hover{transform:translateY(-3px);box-shadow:0 10px 40px rgba(0,212,255,.6)}
.login-btn span{position:relative;z-index:1}
.login-btn .spinner{display:none;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.login-btn.loading .btn-text{display:none}
.login-btn.loading .spinner{display:block}

/* divider */
.or-line{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.or-line::before,.or-line::after{content:"";flex:1;height:1px;background:var(--border)}
.or-line span{font-size:11px;color:rgba(255,255,255,.2);font-weight:600;letter-spacing:1px}

/* links */
.card-links{display:flex;flex-direction:column;gap:9px;text-align:center}
.card-links a{font-size:13px;color:var(--muted);text-decoration:none;transition:.2s}
.card-links a:hover{color:var(--cyan)}
.card-links a span{color:var(--cyan);font-weight:600}
.card-links .forgot{font-size:12.5px;color:rgba(0,212,255,.55)}
.card-links .forgot:hover{color:var(--cyan)}

/* footer */
.footer{position:relative;z-index:1;border-top:1px solid var(--border);padding:20px 60px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.footer-logo{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;text-decoration:none;color:white}
.footer-icon{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:10px}
.footer-logo span{background:linear-gradient(90deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.footer-copy{font-size:11.5px;color:rgba(255,255,255,.15)}

@media(max-width:820px){
  .main{flex-direction:column;gap:36px;padding-top:100px}
  .robot-wrap{display:none}
  .login-card{width:100%;max-width:420px}
}
</style>
</head>
<body>

<div id="mesh"></div>
<div id="grid"></div>
<canvas id="stars"></canvas>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="index.html" class="logo">
    <div class="logo-icon">🛡</div>
    Job<span>Shield</span>
  </a>
  <a href="index.html" class="nav-back">← Back to Home</a>
</nav>

<!-- MAIN -->
<div class="main">

  <!-- ROBOT -->
  <div class="robot-wrap">
    <div style="position:relative;width:260px;height:300px;display:flex;align-items:center;justify-content:center">
      <div class="r-orbit-wrap">
        <div class="r-ring r-ring-1"><div class="r-dot r-dot-c"></div></div>
        <div class="r-ring r-ring-2"><div class="r-dot r-dot-b" style="top:auto;bottom:-4px;left:50%;transform:translateX(-50%)"></div></div>
      </div>
      <div class="robot">
        <div class="r-head">
          <div class="r-eyes">
            <div class="r-eye"></div>
            <div class="r-eye" style="animation-delay:.15s"></div>
          </div>
          <div class="r-mouth"></div>
        </div>
        <div class="r-neck"></div>
        <div style="position:relative">
          <div class="r-arms">
            <div class="r-arm left"></div>
            <div class="r-arm right"></div>
          </div>
          <div class="r-body">
            <div class="r-core"></div>
            <div class="r-vents">
              <div class="r-vent"></div>
              <div class="r-vent"></div>
              <div class="r-vent"></div>
            </div>
          </div>
        </div>
        <div class="r-legs">
          <div class="r-leg left"></div>
          <div class="r-leg right"></div>
        </div>
      </div>
    </div>
    <div class="robot-label">
      <h3>JobShield AI</h3>
      <p>Your job scam detector 🛡</p>
    </div>
  </div>

  <!-- LOGIN CARD -->
  <div class="login-card">
    <span class="card-tag">Secure Portal</span>
    <div class="card-title">Welcome <span>Back</span></div>
    <p class="card-sub">Login to scan jobs, track scams & stay safe.</p>

    <div class="toast" id="toast">
      <span id="toastIcon"></span>
      <span id="toastMsg"></span>
    </div>

    <div class="field">
      <label>Username</label>
      <div class="field-wrap">
        <input type="text" id="username" placeholder="Enter your username" autocomplete="off">
      </div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="field-wrap">
        <input type="password" id="password" placeholder="Enter your password" autocomplete="off">
        <button class="eye-btn" onclick="togglePwd()" id="eyeBtn" title="Toggle password">👁</button>
      </div>
    </div>

    <button class="login-btn" id="loginBtn" onclick="loginUser()">
      <span class="btn-text">Login →</span>
      <div class="spinner"></div>
    </button>

    <div class="or-line"><span>OR</span></div>

    <div class="card-links">
      <a href="register.html">New here? <span>Create account</span></a>
      <a href="forgot_password.html" class="forgot">Forgot password?</a>
    </div>
  </div>

</div>

<!-- FOOTER -->
<footer class="footer">
  <a href="index.html" class="footer-logo">
    <div class="footer-icon">🛡</div>
    Job<span>Shield</span>
  </a>
  <div class="footer-copy">© 2026 JobShield AI — Stay Smart, Stay Safe</div>
</footer>

<script>
/* STARS */
const cv=document.getElementById("stars"),cx=cv.getContext("2d");
let st=[];
function rsz(){
  cv.width=innerWidth;cv.height=innerHeight;st=[];
  const n=Math.floor(innerWidth*innerHeight/5000);
  for(let i=0;i<n;i++){
    const r=Math.random();
    st.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.4+.1,a:Math.random(),d:(Math.random()*.005+.002)*(Math.random()<.5?1:-1),c:r<.2?"#00d4ff":r<.38?"#1a5aff":r<.5?"#38bdf8":"#ffffff"});
  }
}
rsz();addEventListener("resize",rsz);
(function draw(){
  cx.clearRect(0,0,cv.width,cv.height);
  for(const s of st){
    s.a=Math.max(.03,Math.min(1,s.a+s.d));if(s.a<=.03||s.a>=1)s.d*=-1;
    cx.save();cx.globalAlpha=s.a;
    if(s.r>1){cx.shadowBlur=s.r*5;cx.shadowColor=s.c}
    cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);cx.fillStyle=s.c;cx.fill();cx.restore();
  }
  requestAnimationFrame(draw);
})();

/* TOGGLE PASSWORD */
function togglePwd(){
  const p=document.getElementById("password");
  const b=document.getElementById("eyeBtn");
  p.type=p.type==="password"?"text":"password";
  b.textContent=p.type==="password"?"👁":"🙈";
}

/* TOAST */
function showToast(msg,type){
  const t=document.getElementById("toast");
  const m=document.getElementById("toastMsg");
  const ic=document.getElementById("toastIcon");
  t.className="toast show "+(type==="ok"?"ok":"err");
  ic.textContent=type==="ok"?"✅":"❌";
  m.textContent=msg;
}

/* ENTER KEY */
document.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();loginUser()}});

/* LOGIN */
function loginUser(){
  const btn=document.getElementById("loginBtn");
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value.trim();

  if(!username||!password){showToast("Please fill in both fields.","err");return}

  btn.classList.add("loading");

  fetch("http://127.0.0.1:5000/login",{
    method:"POST",credentials:"include",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username,password})
  })
  .then(r=>r.json())
  .then(data=>{
    btn.classList.remove("loading");
    if(data.status==="success"){
      localStorage.setItem("username",data.username||username);
      showToast("Login successful!","ok");
      setTimeout(()=>window.location.href="dashboard.html",1200);
    } else {
      showToast("Invalid username or password.","err");
    }
  })
  .catch(()=>{
    btn.classList.remove("loading");
    showToast("Server error — check if backend is running.","err");
  });
}
</script>
</body>
</html>
